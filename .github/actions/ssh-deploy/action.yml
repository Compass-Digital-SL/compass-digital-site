name: SSH release deploy
description: >
  rsync a built code artifact to a remote host as a timestamped release, flip the
  `current` symlink atomically, flush WP cache, smoke-test and Lighthouse-check it,
  roll back to the previous release if the smoke test fails, and prune old releases.

inputs:
  ssh_host:
    description: Deploy target hostname.
    required: true
  ssh_user:
    description: SSH user.
    required: true
  ssh_key:
    description: Private SSH key (PEM).
    required: true
  ssh_known_hosts:
    description: Contents for known_hosts (ssh-keyscan output) to pin the host key.
    required: true
  deploy_path:
    description: Base dir on the host that holds releases/ and the current symlink.
    required: true
  site_url:
    description: Public URL to smoke-test and run Lighthouse against.
    required: true
  wp_path:
    description: WordPress root on the host (where wp-cli runs). Usually the docroot.
    required: true
  keep_releases:
    description: How many releases to keep.
    required: false
    default: "5"

runs:
  using: composite
  steps:
    - name: Configure SSH
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p ~/.ssh
        chmod 700 ~/.ssh
        printf '%s\n' "${{ inputs.ssh_key }}" > ~/.ssh/deploy_key
        chmod 600 ~/.ssh/deploy_key
        printf '%s\n' "${{ inputs.ssh_known_hosts }}" > ~/.ssh/known_hosts
        chmod 644 ~/.ssh/known_hosts

    - name: Deploy, verify, rollback on failure
      shell: bash
      env:
        SSH_HOST: ${{ inputs.ssh_host }}
        SSH_USER: ${{ inputs.ssh_user }}
        DEPLOY_PATH: ${{ inputs.deploy_path }}
        SITE_URL: ${{ inputs.site_url }}
        WP_PATH: ${{ inputs.wp_path }}
        KEEP_RELEASES: ${{ inputs.keep_releases }}
      run: |
        set -euo pipefail
        SSH="ssh -i $HOME/.ssh/deploy_key -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o IdentitiesOnly=yes"
        REMOTE="$SSH_USER@$SSH_HOST"
        RELEASE_ID="$(date -u +%Y%m%d%H%M%S)-$(echo "${GITHUB_SHA:-manual}" | cut -c1-7)"
        RELEASES="$DEPLOY_PATH/releases"
        NEW="$RELEASES/$RELEASE_ID"

        echo "::group::Upload release $RELEASE_ID"
        # Record the current release target so we can roll back to it.
        PREVIOUS="$($SSH "$REMOTE" "readlink -f '$DEPLOY_PATH/current' 2>/dev/null || true")"
        echo "Previous release: ${PREVIOUS:-<none>}"
        $SSH "$REMOTE" "mkdir -p '$NEW' '$RELEASES'"
        # Code only. --delete keeps the release clean; uploads/DB are never in the artifact.
        rsync -az --delete \
          -e "$SSH" \
          release/ "$REMOTE:$NEW/"
        echo "::endgroup::"

        echo "::group::Activate release"
        # Atomic symlink flip: write to a temp link, then mv over `current`.
        $SSH "$REMOTE" "ln -sfn '$NEW' '$DEPLOY_PATH/current.tmp' && mv -Tf '$DEPLOY_PATH/current.tmp' '$DEPLOY_PATH/current'"
        # Flush object + rewrite cache so new code is served immediately.
        $SSH "$REMOTE" "wp --path='$WP_PATH' cache flush || true; wp --path='$WP_PATH' rewrite flush || true"
        echo "::endgroup::"

        echo "::group::Smoke test"
        smoke_ok=1
        for path in "/" "/get-a-quote/"; do
          code="$(curl -fsS -o /dev/null -w '%{http_code}' --max-time 30 --retry 3 --retry-delay 5 "${SITE_URL%/}$path" || echo 000)"
          echo "GET $path -> $code"
          case "$code" in 200|301|302) ;; *) smoke_ok=0 ;; esac
        done
        echo "::endgroup::"

        if [ "$smoke_ok" -ne 1 ]; then
          echo "::error::Smoke test failed — rolling back."
          if [ -n "$PREVIOUS" ]; then
            $SSH "$REMOTE" "ln -sfn '$PREVIOUS' '$DEPLOY_PATH/current.tmp' && mv -Tf '$DEPLOY_PATH/current.tmp' '$DEPLOY_PATH/current'; wp --path='$WP_PATH' cache flush || true"
            echo "Rolled back to $PREVIOUS"
          else
            echo "::warning::No previous release to roll back to."
          fi
          $SSH "$REMOTE" "rm -rf '$NEW'" || true
          exit 1
        fi

        echo "::group::Prune old releases (keep $KEEP_RELEASES)"
        $SSH "$REMOTE" "cd '$RELEASES' && ls -1dt */ 2>/dev/null | tail -n +$((KEEP_RELEASES + 1)) | xargs -r rm -rf"
        echo "::endgroup::"

    - name: Lighthouse check (non-blocking)
      shell: bash
      env:
        SITE_URL: ${{ inputs.site_url }}
      run: |
        set -euo pipefail
        npx --yes @lhci/cli@0.14.x autorun \
          --collect.url="$SITE_URL" \
          --collect.settings.chromeFlags="--no-sandbox" \
          --upload.target=temporary-public-storage \
          || echo "::warning::Lighthouse check reported issues — review the report above."
