version: 2
updates:
  # Root npm (wp-env, CI tooling: eslint, stylelint, playwright, lighthouse).
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: ["dependencies"]
    commit-message:
      prefix: "chore"
      include: scope
    groups:
      dev-dependencies:
        patterns: ["*"]

  # Theme npm (Vite build).
  - package-ecosystem: npm
    directory: "/theme"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: ["dependencies"]
    commit-message:
      prefix: "chore"
      include: scope
    groups:
      dev-dependencies:
        patterns: ["*"]

  # Composer (PHPCS + WordPress Coding Standards).
  - package-ecosystem: composer
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: ["dependencies"]
    commit-message:
      prefix: "chore"
      include: scope

  # GitHub Actions used in the CI workflow.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    labels: ["dependencies", "ci"]
    commit-message:
      prefix: "ci"
